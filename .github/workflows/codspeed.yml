name: CodSpeed
on:
  push:
    branches:
      - master
      - main
  pull_request:
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies (test group)
        run: uv sync --no-default-groups --group test
      # The CodSpeed runner installs its valgrind instrument and libc6-dbg through
      # apt; make sure those installs can never block on a lock or on needrestart.
      - name: Prepare apt for unattended installs
        run: |
          sudo mkdir -p /etc/needrestart/conf.d
          echo "\$nrconf{restart} = 'a';" | sudo tee /etc/needrestart/conf.d/99-codspeed.conf > /dev/null
          echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99-codspeed-lock > /dev/null
          sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get update
          sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y libc6-dbg
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: uv run pytest tests/benchmarks --codspeed
