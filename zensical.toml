# ============================================================================
# Zensical Configuration for Tur
# ============================================================================

[project]
site_name = "Tur: Persona Engineering Framework"
site_description = "Transform LLMs into deterministic engineering partners using the Council Architecture."
site_author = "Eran Rivlis, Ariel"
# site_url = "https://your-tur-domain.com/"

copyright = """
Copyright &copy; 2026 Eran Rivlis
"""

# Explicit Navigation
nav = [
  { "Home" = "index.md" },
  { "Core Concepts" = [
      "concepts/persona-engineering.md",
      "concepts/council-of-giants.md",
      "concepts/tri-partite-architecture.md",
      "concepts/biological-lifecycle.md",
      "concepts/fractal-memory.md",
      "concepts/harness-integration.md"
  ]},
  { "Usage Guide" = "usage.md" },
  { "Proposals (EPs)" = [
      "proposals/EP-0000-process.md",
      "proposals/EP-0001-project-boundaries.md",
      "proposals/EP-0002-roadmap.md",
      "proposals/EP-0100-aleph-server.md",
      "proposals/EP-0101-llm-agnosticism.md",
      "proposals/EP-0102-orchestration-engine.md",
      "proposals/EP-0103-deductive-memory.md",
      "proposals/EP-0104-federated-knowledge.md",
      "proposals/EP-0105-mcp-sdk-integration.md",
      "proposals/EP-0106-merkle-memory.md",
      "proposals/EP-0107-multi-agent-swarms.md",
      "proposals/EP-0108-the-spark-protocol.md",
      "proposals/EP-0109-harness-and-terrain-adapters.md"
  ]}
]

[project.theme]
language = "en"
logo = "assets/images/logo-drawing.png"

features = [
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Markdown Extensions for advanced features
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
  alternate_style = true
[project.markdown_extensions.pymdownx.arithmatex]
  generic = true

[project.extra_javascript]
  "javascripts/mathjax.js" = {}
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js" = {}
