[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tur"
version = "0.10.3"
description = "Persistent state and memory management engine for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Eran Rivlis" },
    { name = "Ariel" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed"
]

dependencies = [
    "filelock>=3.14.0",
    "jinja2>=3.1.0",
    "networkx>=3.6",
    "platformdirs>=4.2.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0"
]


[project.optional-dependencies]
gemini = [
    "google-genai",
]
mcp = [
    "mcp>=1.27,<2",
]

[dependency-groups]
dev = [
    "commitizen>=4.10.0",
    "library-skills",
    "pipdeptree",
    "pyinstrument>=5.1.2",
    "pyrefly",
    "ruff",
    "ty",
    "uv",
    "zuban"
]
docs = [
    "zensical",
    "mkdocstrings-python",
]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-randomly",
    "pytest-xdist",
    "markdown-pytest",
    "requests",
]

[project.urls]
Repository = "https://github.com/erivlis/tur"
Documentation = "https://erivlis.github.io/tur/"
Discussions = "https://github.com/erivlis/tur/discussions"
Issues = "https://github.com/erivlis/tur/issues"

[project.scripts]
tur = "tur.cli.agent:main"
tur-adm = "tur.cli.admin:main"
tur-mcp = "tur.cli.mcp:main"


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.report]
show_missing = true
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod"
]
omit = [
    # omit anything in a .venv directory anywhere
    "*/.venv/*",
    # omit everything in /tests
    "/tests/*",
    "src/tur/__main__.py",
]


[tool.coverage.run]
branch = true
relative_files = false
omit = [
    # omit anything in a .venv directory anywhere
    "*/.venv/*",
    # omit everything in /tests
    "/tests/*",
    "src/tur/__main__.py",
]

[tool.black]
line-length = 120
#extend-exclude = ''

[tool.hatch.build.targets.wheel]
packages = ["src/tur"]

[tool.hatch.build.targets.sdist]
include = ["src/tur", "src/tur/.agents", "README.md", "LICENSE"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
